<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Portfolib</title>
    <link rel="icon" type="image/x-icon" href="public/image/favicon.ico">
    <link rel="stylesheet" href="mystyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=block" rel="stylesheet">
    <script>
        let fav_num = Math.floor(Math.random() * 4+1);

        let favicon = document.createElement('link');
        favicon.rel = 'icon';
        favicon.href = `image/favicon${fav_num}.ico`;

        document.head.appendChild(favicon);
    </script>
</head>
<body>
</body>
</html>
